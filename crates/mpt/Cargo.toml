[package]
name = "openvm-mpt"
edition.workspace = true
repository.workspace = true
homepage.workspace = true
exclude.workspace = true
version.workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
smallvec.workspace = true
bumpalo = { workspace = true, features = ["collections"] }
bytes.workspace = true

# reth
reth-trie.workspace = true

# revm
revm.workspace = true
revm-primitives.workspace = true

# alloy
alloy-rlp.workspace = true

# host-only dependencies
bincode = { workspace = true, optional = true }
itertools = { workspace = true, optional = true }
reth-stateless = { workspace = true, optional = true }
reth-storage-errors = { workspace = true, optional = true }
reth-trie-common = { workspace = true, optional = true }
alloy-consensus = { workspace = true, optional = true }
alloy-primitives = { workspace = true, optional = true, features = ["rayon", "map-foldhash"] }

[dev-dependencies]
hex-literal.workspace = true

[lints]
workspace = true

[features]
default = []
host = [
    "dep:bincode",
    "dep:itertools",
    "dep:reth-stateless",
    "dep:reth-storage-errors",
    "dep:reth-trie-common",
    "dep:alloy-consensus",
    "dep:alloy-primitives",
]
